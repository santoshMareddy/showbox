plugins {
    id 'com.android.application'
}

// Release signing. keystore.properties is generated by tools/new-keystore.ps1 and stays on this PC.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.showbox.demo'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.showbox.demo'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            if (ksProps['storeFile']) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // The JavaScript bridge is reflected into by the WebView, so shrinking is off:
            // an APK of this size gains nothing from it and R8 could strip the bridge.
            minifyEnabled false
            shrinkResources false
            signingConfig ksProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web build is already minified; leaving it uncompressed would only grow the APK.
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.DS_Store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    lint {
        abortOnError false
    }
}
