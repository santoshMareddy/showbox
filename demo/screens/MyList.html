<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>ShowBox MyList</title>
  </head>
<body>


  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; overflow: hidden; background: #0B0A08; color: #F3EEE4; font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F2B441; } a:hover { color: #FFD16A; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
    .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .poster { position: relative; overflow: hidden; border-radius: 10px; height: 165px; }
    .poster .t { position: absolute; left: 9px; right: 9px; bottom: 9px; font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-weight: 800; font-size: 12px; line-height: 1.05; letter-spacing: 0.03em; text-transform: uppercase; color: #FFFFFF; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
    .poster.light .t { color: #2B1A12; text-shadow: none; }
    .poster .dl { position: absolute; left: 7px; top: 7px; height: 20px; padding: 0 6px; border-radius: 5px; background: rgba(0,0,0,.6); font-size: 10px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; }
    .art-orbit { background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0) 27%, rgba(255,255,255,.75) 27.8%, rgba(255,255,255,0) 29%), radial-gradient(circle at 50% 30%, #7C86FF 0%, rgba(124,134,255,0) 36%), linear-gradient(180deg, #161D52 0%, #05060F 100%); }
    .art-ashfall { background: radial-gradient(ellipse at 25% 90%, #FF6A3D 0%, rgba(255,106,61,0) 55%), linear-gradient(200deg, #4A1410 0%, #120505 100%); }
    .art-salt { background: linear-gradient(180deg, rgba(255,255,255,0) 58%, rgba(255,255,255,.22) 58.5%, rgba(255,255,255,0) 60%), linear-gradient(180deg, #0F5B66 0%, #031A1E 100%); }
    .art-neon { background: repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 5px, rgba(0,0,0,0) 5px 18px), radial-gradient(ellipse at 50% 100%, #FF3DA6 0%, rgba(255,61,166,0) 60%), linear-gradient(180deg, #23103F 0%, #070312 100%); }
    .art-iron { background: repeating-linear-gradient(90deg, rgba(0,0,0,.5) 0 5px, rgba(0,0,0,0) 5px 22px), linear-gradient(180deg, #2C4A2A 0%, #0A0F09 100%); }
    .art-paper { background: radial-gradient(circle at 70% 30%, #FFF4E5 0%, #FFF4E5 18%, rgba(255,244,229,0) 19%), radial-gradient(circle at 30% 65%, #E9A27F 0%, #E9A27F 12%, rgba(233,162,127,0) 13%), linear-gradient(180deg, #F1D7BD 0%, #C98A6A 100%); }
    .art-signal { background: radial-gradient(circle at 50% 50%, #FF3B3B 0%, #FF3B3B 6%, rgba(255,59,59,0) 7%), repeating-linear-gradient(0deg, #1C1C1C 0 1px, #2B2B2B 1px 3px); }
    .art-verdant { background: radial-gradient(circle at 75% 20%, #E6FF5C 0%, rgba(230,255,92,0) 40%), linear-gradient(160deg, #365A1E 0%, #0C160A 100%); }
    .art-crown { background: radial-gradient(circle at 50% 42%, #F2C14E 0%, #F2C14E 14%, rgba(242,193,78,0) 15%), linear-gradient(180deg, #3A1B5C 0%, #0B0716 100%); }
    .art-run { background: linear-gradient(115deg, rgba(255,255,255,0) 48%, rgba(255,255,255,.35) 49%, rgba(255,255,255,0) 51%), linear-gradient(135deg, #10305C 0%, #050A14 100%); }
    .art-lumen { background: radial-gradient(circle at 50% 60%, #DFFBFF 0%, rgba(223,251,255,0) 45%), linear-gradient(180deg, #2A7C8C 0%, #071E24 100%); }
    .art-dust { background: radial-gradient(circle at 50% 48%, #FFE08A 0%, #FFE08A 16%, rgba(255,224,138,0) 17%), linear-gradient(180deg, #F0A64A 0%, #F0A64A 55%, #7A3E1B 55%, #4A2410 100%); }
  </style>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0A08; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 54px 20px 0 20px; flex: none;">
    <div class="display" style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 40px;">My List</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F3EEE4; margin-right: -10px;">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 20px 0 20px; flex: none;">
    <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #F3EEE4; color: #0B0A08; font-size: 13px; font-weight: 600; display: flex; align-items: center;">All</div>
    <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #1E1B16; color: #F3EEE4; font-size: 13px; font-weight: 500; display: flex; align-items: center;">Watching</div>
    <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #1E1B16; color: #F3EEE4; font-size: 13px; font-weight: 500; display: flex; align-items: center;">Saved</div>
    <div style="height: 34px; padding: 0 14px; border-radius: 17px; background: #1E1B16; color: #F3EEE4; font-size: 13px; font-weight: 500; display: flex; align-items: center;">Finished</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 9px; padding: 18px 20px 0 20px; flex: none;">
    <div class="poster art-orbit"><div class="dl">EP 24</div><div class="t">Moonlit Contract</div></div>
    <div class="poster art-ashfall"><div class="dl">EP 41</div><div class="t">Runaway Heart</div></div>
    <div class="poster art-salt"><div class="t">The Night Shift</div></div>
    <div class="poster art-neon"><div class="dl">EP 7</div><div class="t">Second Chance CEO</div></div>
    <div class="poster art-iron"><div class="t">Ironwood</div></div>
    <div class="poster art-paper light"><div class="t">Paper Moons</div></div>
    <div class="poster art-signal"><div class="t">Signal Lost</div></div>
    <div class="poster art-verdant"><div class="t">Dragon's Bride</div></div>
    <div class="poster art-crown"><div class="dl">EP 3</div><div class="t">The Forgotten Heiress</div></div>
    <div class="poster art-run"><div class="t">Midnight Run</div></div>
    <div class="poster art-lumen"><div class="t">Lumen</div></div>
    <div class="poster art-dust"><div class="t">Dust Devils</div></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 4px 22px 4px; background: rgba(11,10,8,.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,.06); display: flex; align-items: flex-start; justify-content: space-around;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 50px; color: #8C8578;">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
      <div style="font-size: 11px; font-weight: 500;">Home</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 50px; color: #8C8578;">
      <svg class="ico" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M11 9.5l4 2.5-4 2.5z"></path></svg>
      <div style="font-size: 11px; font-weight: 500;">For You</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 50px; color: #F2B441;">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"></path></svg>
      <div style="font-size: 11px; font-weight: 600;">My List</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 50px; color: #8C8578;">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M5 12v8h14v-8M12 8v12M12 8c-2-3-6-3-6-1s3 2 6 1zM12 8c2-3 6-3 6-1s-3 2-6 1z"></path></svg>
      <div style="font-size: 11px; font-weight: 500;">Rewards</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 50px; color: #8C8578;">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
      <div style="font-size: 11px; font-weight: 500;">Me</div>
    </div>
  </div>

</div>

</body>
</html>
