<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>ShowBox Search</title>
  </head>
<body>


  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; overflow: hidden; background: #0B0A08; color: #F3EEE4; font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F2B441; } a:hover { color: #FFD16A; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
    .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .poster { position: relative; overflow: hidden; border-radius: 10px; flex: none; }
    .art-orbit { background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0) 27%, rgba(255,255,255,.75) 27.8%, rgba(255,255,255,0) 29%), radial-gradient(circle at 50% 30%, #7C86FF 0%, rgba(124,134,255,0) 36%), linear-gradient(180deg, #161D52 0%, #05060F 100%); }
    .art-ashfall { background: radial-gradient(ellipse at 25% 90%, #FF6A3D 0%, rgba(255,106,61,0) 55%), linear-gradient(200deg, #4A1410 0%, #120505 100%); }
    .art-salt { background: linear-gradient(180deg, rgba(255,255,255,0) 58%, rgba(255,255,255,.22) 58.5%, rgba(255,255,255,0) 60%), linear-gradient(180deg, #0F5B66 0%, #031A1E 100%); }
    .art-neon { background: repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 5px, rgba(0,0,0,0) 5px 18px), radial-gradient(ellipse at 50% 100%, #FF3DA6 0%, rgba(255,61,166,0) 60%), linear-gradient(180deg, #23103F 0%, #070312 100%); }
    .art-iron { background: repeating-linear-gradient(90deg, rgba(0,0,0,.5) 0 5px, rgba(0,0,0,0) 5px 22px), linear-gradient(180deg, #2C4A2A 0%, #0A0F09 100%); }
    .art-paper { background: radial-gradient(circle at 70% 30%, #FFF4E5 0%, #FFF4E5 18%, rgba(255,244,229,0) 19%), radial-gradient(circle at 30% 65%, #E9A27F 0%, #E9A27F 12%, rgba(233,162,127,0) 13%), linear-gradient(180deg, #F1D7BD 0%, #C98A6A 100%); }
    .art-signal { background: radial-gradient(circle at 50% 50%, #FF3B3B 0%, #FF3B3B 6%, rgba(255,59,59,0) 7%), repeating-linear-gradient(0deg, #1C1C1C 0 1px, #2B2B2B 1px 3px); }
    .art-crown { background: radial-gradient(circle at 50% 42%, #F2C14E 0%, #F2C14E 14%, rgba(242,193,78,0) 15%), linear-gradient(180deg, #3A1B5C 0%, #0B0716 100%); }
    .tile { position: relative; height: 82px; border-radius: 12px; overflow: hidden; }
    .tile .mini { position: absolute; right: -8px; top: 12px; width: 46px; height: 68px; border-radius: 6px; transform: rotate(12deg); box-shadow: 0 6px 16px rgba(0,0,0,.45); }
    .tile .lbl { position: absolute; left: 14px; bottom: 12px; font-size: 15px; font-weight: 600; color: #F3EEE4; }
  </style>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0A08; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; margin: 54px 20px 0 20px; border-radius: 14px; background: #1E1B16; box-sizing: border-box; flex: none;">
    <svg class="ico" style="width: 22px; height: 22px; color: #F3EEE4; margin-left: -4px;" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg>
    <svg class="ico" style="width: 20px; height: 20px; color: #A39C8F;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <div style="flex: 1; font-size: 15px; color: #8C8578;">Series, genres, actors</div>
    <svg class="ico" style="width: 20px; height: 20px; color: #A39C8F;" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 22px 20px 0 20px; flex: none;">

      <div class="display" style="font-size: 17px; font-weight: 700;">Recent</div>
      <div style="font-size: 13px; color: #A39C8F;">Clear</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 44px; color: #D9D2C5;">
      <svg class="ico" style="width: 20px; height: 20px; color: #8C8578;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
      <div style="flex: 1; font-size: 15px;">married to the heir</div>
      <svg class="ico" style="width: 18px; height: 18px; color: #8C8578;" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 44px; color: #D9D2C5;">
      <svg class="ico" style="width: 20px; height: 20px; color: #8C8578;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
      <div style="flex: 1; font-size: 15px;">revenge</div>
      <svg class="ico" style="width: 18px; height: 18px; color: #8C8578;" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 44px; color: #D9D2C5;">
      <svg class="ico" style="width: 20px; height: 20px; color: #8C8578;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
      <div style="flex: 1; font-size: 15px;">second chance ceo</div>
      <svg class="ico" style="width: 18px; height: 18px; color: #8C8578;" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 0 20px; flex: none;">
    <div class="display" style="font-size: 17px; font-weight: 700; height: 22px;">Browse by genre</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div class="tile" style="background: #3A1E2A;"><div class="mini art-neon"></div><div class="lbl">Romance</div></div>
      <div class="tile" style="background: #2E1A24;"><div class="mini art-signal"></div><div class="lbl">Revenge</div></div>
      <div class="tile" style="background: #17283A;"><div class="mini art-orbit"></div><div class="lbl">CEO and billionaire</div></div>
      <div class="tile" style="background: #2A2236;"><div class="mini art-crown"></div><div class="lbl">Fantasy</div></div>
      <div class="tile" style="background: #3A3218;"><div class="mini art-paper"></div><div class="lbl">Family</div></div>
      <div class="tile" style="background: #1C3328;"><div class="mini art-iron"></div><div class="lbl">Suspense</div></div>
      <div class="tile" style="background: #2F2A12;"><div class="mini art-salt"></div><div class="lbl">Comedy</div></div>
      <div class="tile" style="background: #3A1F1A;"><div class="mini art-ashfall"></div><div class="lbl">Historical</div></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 20px 0 20px; flex: none;">
    <div class="display" style="font-size: 17px; font-weight: 700; height: 22px;">Top searches</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: #1E1B16; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;"><span style="color: #F2B441; font-weight: 700;">1</span><span>Married to the Heir</span></div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: #1E1B16; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;"><span style="color: #F2B441; font-weight: 700;">2</span><span>Her Silent Revenge</span></div>
      <div style="height: 32px; padding: 0 12px; border-radius: 16px; background: #1E1B16; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;"><span style="color: #A39C8F; font-weight: 700;">3</span><span>Dragon's Bride</span></div>
    </div>
  </div>

</div>

</body>
</html>
